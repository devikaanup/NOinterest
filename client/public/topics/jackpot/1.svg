<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 320" width="300" height="320">
  <rect width="300" height="320" rx="14" fill="#fefce8"/>
  <rect x="8" y="8" width="284" height="304" rx="10" fill="none" stroke="#eab308" stroke-width="2.5" stroke-dasharray="6,4"/>
  
            <!-- Slot Machine Reels: 7 - 7 - EGGPLANT -->
            <rect x="45" y="60" width="210" height="140" rx="14" fill="#dc2626" stroke="#1e293b" stroke-width="6"/>
