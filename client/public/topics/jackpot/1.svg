            <text x="85" y="135" font-family="'Impact', sans-serif" font-size="44" fill="#dc2626" text-anchor="middle">7</text>
            <!-- Reel 2 -->
            <rect x="125" y="80" width="50" height="80" rx="4" fill="#ffffff" stroke="#1e293b" stroke-width="4"/>
